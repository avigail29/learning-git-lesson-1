<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            text-align: center;

        }
        .box {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 600px;
            margin: auto;
        }
        h1 {
            color: #333;
        }
        p {
            font-size: 20px;
            color: #555;
            line-height: 1.6;
        }
        a {
            display: inline-block;
            margin-top: 25px;
            text-decoration: none;
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
        }
        a:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="box">
        <h1>המשפט שלי לחיים 🌟</h1>
        <p>"גם כשיותר מדי קשה וחושבים שזה בלתי אפשרי – תעשי צעד אחר צעד, ותגלי שאת מסוגלת להכול."</p>
        
        <a href="index.html">חזרה לדף הבית</a>

</html>
